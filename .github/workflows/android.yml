name: Android APK
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build, unit tests and Android Lint
        run: |
          set +e
          ./gradlew --no-daemon --stacktrace assembleDebug testDebugUnitTest lintDebug 2>&1 | tee gradle-build.log
          build_status=${PIPESTATUS[0]}
          set -e
          if [ "$build_status" -ne 0 ]; then
            python3 - <<'PYLOG'
          import pathlib
          text = '\n'.join(pathlib.Path('gradle-build.log').read_text().splitlines()[-90:])
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Gradle build failed::' + text)
          PYLOG
          fi
          exit "$build_status"
      - name: Verify APK signature and package
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/app-debug.apk.sha256
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: DeX-Tools-n2s-debug-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: |
            gradle-build.log
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DeX-Tools-n2s-debug-${{ github.sha }}
          path: apk
      - name: Publish APK on GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "DeX Tools n2s $GITHUB_REF_NAME" --notes 'Wersja debug do instalacji i testów. Ograniczenia i instrukcja: README repozytorium.' apk/app-debug.apk apk/app-debug.apk.sha256
